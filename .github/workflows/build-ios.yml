name: Build iOS Production IPA (unsigned)

on:
  workflow_dispatch:

jobs:
  preflight:
    name: Preflight checks before IPA
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Mobile lint, typecheck and regressions
        working-directory: openspot-mobile
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npx tsc --noEmit
          npm run test:automix
          npm run test:extensions

      - name: Desktop lint, typecheck and regressions
        working-directory: openspot-desktop
        run: |
          npm ci --no-audit --no-fund
          npm run lint
          npx tsc --noEmit
          npm run test:automix
          npm run test:extensions

      - name: Setup Go for Extension Core
        uses: actions/setup-go@v5
        with:
          go-version-file: third_party/spotiflac-extension-core/upstream/go.mod
          cache: false

      - name: Go format, vet and test
        working-directory: third_party/spotiflac-extension-core/upstream
        run: |
          go mod tidy
          test -z "$(gofmt -l .)" || { echo 'Go files need gofmt:'; gofmt -l .; exit 1; }
          go vet ./...
          go test ./...

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      - uses: dtolnay/rust-toolchain@stable

      - name: Build Extension Core sidecar for Tauri check
        working-directory: third_party/spotiflac-extension-core/upstream
        run: |
          mkdir -p "$GITHUB_WORKSPACE/openspot-desktop/src-tauri/binaries"
          go build -o "$GITHUB_WORKSPACE/openspot-desktop/src-tauri/binaries/openspot-extension-core-host-x86_64-unknown-linux-gnu" ./cmd/extension-core-host

      - name: Tauri format and typecheck
        run: |
          cargo fmt --manifest-path openspot-desktop/src-tauri/Cargo.toml -- --check
          cargo check --locked --manifest-path openspot-desktop/src-tauri/Cargo.toml

  build:
    needs: preflight
    # Use a fixed hosted image so a moving latest alias cannot block IPA builds.
    # Expo Modules Core 2.5 uses SwiftUI APIs introduced with Xcode 16.
    runs-on: macos-15
    defaults:
      run:
        working-directory: openspot-mobile

    env:
      CI: "1"
      NODE_ENV: "production"
      APP_NAME: "OpenSpot"
      SCHEME_NAME: "OpenSpot"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Remove generated build state
        run: |
          rm -rf "$RUNNER_TEMP/openspot-derived-data-$GITHUB_SHA"
          rm -rf ios/build

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare iOS dependency manifest
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            delete pkg.dependencies['expo-dev-client'];
            delete pkg.dependencies['expo-dev-menu'];
            delete pkg.dependencies['expo-dev-launcher'];
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2));
            
            const app = JSON.parse(fs.readFileSync('app.json', 'utf8'));
            app.expo.plugins = app.expo.plugins.filter(p => {
              const name = typeof p === 'string' ? p : p[0];
              return !['expo-dev-client', 'expo-dev-menu', 'expo-dev-launcher'].includes(name);
            });
            fs.writeFileSync('app.json', JSON.stringify(app, null, 2));
          "

      - name: Install dependencies
        env:
          npm_config_cache: ${{ runner.temp }}/openspot-npm-${{ github.sha }}
        run: npm install --no-audit --no-fund --prefer-online

      - name: Select Xcode 16 toolchain
        run: |
          XCODE_PATH=""
          for candidate in /Applications/Xcode_16.4*.app /Applications/Xcode_16.3*.app /Applications/Xcode_16.2*.app; do
            [ -d "$candidate" ] || continue
            if DEVELOPER_DIR="$candidate/Contents/Developer" xcrun --sdk iphoneos --show-sdk-path >/dev/null 2>&1; then
              XCODE_PATH="$candidate"
              break
            fi
          done
          if [ -z "$XCODE_PATH" ]; then
            for candidate in /Applications/Xcode_16*.app; do
              [ -d "$candidate" ] || continue
              XCODE_PATH="$candidate"
              break
            done
          fi
          test -n "$XCODE_PATH"
          sudo xcode-select --switch "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcodebuild -showsdks
          xcrun --sdk iphoneos --show-sdk-path

      - name: Setup Go for Extension Core
        uses: actions/setup-go@v5
        with:
          go-version-file: third_party/spotiflac-extension-core/upstream/go.mod
          cache: false

      - name: Build Extension Core iOS framework
        run: |
          cd "$GITHUB_WORKSPACE/third_party/spotiflac-extension-core/upstream"
          go mod download
          go install golang.org/x/mobile/cmd/gomobile
          export PATH="$(go env GOPATH)/bin:$PATH"
          gomobile init
          mkdir -p "$GITHUB_WORKSPACE/openspot-mobile/modules/openspot-extension-core/ios/Frameworks"
          gomobile bind \
            -target=ios \
            -tags ios \
            -o "$GITHUB_WORKSPACE/openspot-mobile/modules/openspot-extension-core/ios/Frameworks/Gobackend.xcframework" \
            "$GITHUB_WORKSPACE/third_party/spotiflac-extension-core/upstream"
          test -d "$GITHUB_WORKSPACE/openspot-mobile/modules/openspot-extension-core/ios/Frameworks/Gobackend.xcframework"

      - name: Create eas.json from secret
        run: printf '%s' '${{ secrets.EAS_JSON_CONTENT }}' > eas.json

      - name: Create .env from secret
        run: printf '%s' '${{ secrets.DOT_ENV_CONTENT }}' > .env

      - name: Prebuild iOS
        run: npx expo prebuild --platform ios --clean

      - name: Install Pods
        run: |
          cd ios
          export RCT_NEW_ARCH_ENABLED=0
          pod install
          # Xcode rejects fmt's compile-time format strings under C++20.
          # Keep the workaround scoped to fmt; React Native targets retain
          # their generated language-standard settings.
          ruby -rxcodeproj -e 'project = Xcodeproj::Project.open("Pods/Pods.xcodeproj"); target = project.targets.find { |candidate| candidate.name == "fmt" }; abort "fmt target not found" unless target; target.build_configurations.each { |configuration| configuration.build_settings["CLANG_CXX_LANGUAGE_STANDARD"] = "c++17" }; project.save'

      - name: Bundle JS (Hermes production)
        run: |
          npx expo export:embed \
            --platform ios \
            --entry-file index.js \
            --bundle-output ios/main.jsbundle \
            --assets-dest ios \
            --dev false \
            --reset-cache \
            --bytecode

      - name: Fix Xcode Build Phase
        run: |
          sed -i '' 's/--dev true/--dev false/g' ios/*/project.pbxproj || true

      - name: Build Archive (unsigned)
        run: |
          rm -rf "$RUNNER_TEMP/openspot-derived-data-$GITHUB_SHA"
          rm -rf ios/build
          cd ios
          xcodebuild archive \
            -workspace $APP_NAME.xcworkspace \
            -scheme $SCHEME_NAME \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/OpenSpot.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            SWIFT_ENABLE_EXPLICIT_MODULES=NO \
            -derivedDataPath "$RUNNER_TEMP/openspot-derived-data-$GITHUB_SHA" \
            -jobs 3

      - name: Verify bundle inside app
        run: |
          cd ios
          APP_PATH=$(find build/OpenSpot.xcarchive/Products/Applications -name "*.app" | head -1)
          echo "App: $APP_PATH"
          if [ ! -f "$APP_PATH/main.jsbundle" ]; then
            echo "Copiando bundle manualmente..."
            cp main.jsbundle "$APP_PATH/main.jsbundle"
          fi
          ls -la "$APP_PATH"

      - name: Package IPA
        run: |
          cd ios
          APP_PATH=$(find build/OpenSpot.xcarchive/Products/Applications -name "*.app" | head -1)
          mkdir -p build/Payload
          cp -r "$APP_PATH" build/Payload/
          cd build
          zip -r OpenSpot.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: OpenSpot-IPA
          path: openspot-mobile/ios/build/OpenSpot.ipa
