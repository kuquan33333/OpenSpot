name: Import pinned SpotiFLAC download exports once

on:
  push:
    branches:
      - feature/openspot-vnext-extension-automix
    paths:
      - '.github/workflows/import-spotiflac-download-exports-once.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/openspot-vnext-extension-automix
      - name: Import exact pinned download export contract
        run: |
          set -euo pipefail
          curl --fail --location --silent --show-error \
            'https://raw.githubusercontent.com/todo996/SpotiFLAC-Mobile/8165fc99f18234049d003ec8379dea7792c452a1/go_backend/exports_download.go' \
            --output third_party/spotiflac-extension-core/upstream/exports_download.go
          test -s third_party/spotiflac-extension-core/upstream/exports_download.go
          grep -q '^type DownloadRequest struct' third_party/spotiflac-extension-core/upstream/exports_download.go
          grep -q '^type DownloadResponse struct' third_party/spotiflac-extension-core/upstream/exports_download.go
      - name: Commit pinned download exports
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add third_party/spotiflac-extension-core/upstream/exports_download.go
          if git diff --cached --quiet; then
            echo 'Pinned download exports already match.'
            exit 0
          fi
          git commit -m 'vendor(extension): import pinned download exports contract'
          git push origin HEAD:feature/openspot-vnext-extension-automix
