name: Extension Core - One Shot Diagnostic

on:
  workflow_dispatch:
  push:
    branches:
      - feature/openspot-vnext-extension-automix
    paths:
      - '.github/workflows/go-core-check-once.yml'

jobs:
  go-core-check:
    name: Extension Core - diagnostic batch
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: third_party/spotiflac-extension-core/upstream
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: third_party/spotiflac-extension-core/upstream/go.mod
          cache: false
      - name: Resolve modules
        run: go mod tidy
      - name: Go format check
        run: |
          test -z "$(gofmt -l .)" || { echo 'Go files need gofmt:'; gofmt -l .; exit 1; }
      - name: Compile diagnostics
        run: |
          set +e
          echo '=== go vet ==='
          go vet ./...
          vet_status=$?
          echo '=== go test ==='
          go test ./...
          test_status=$?
          echo "vet_status=$vet_status test_status=$test_status"
          if [ "$vet_status" -ne 0 ] || [ "$test_status" -ne 0 ]; then exit 1; fi
