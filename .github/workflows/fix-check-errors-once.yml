name: Fix Current Check Errors - One Shot

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/openspot-vnext-extension-automix
      - name: No-op safety guard
        run: echo "This one-shot patch workflow has already been consumed and is disabled for automatic runs."
