name: Import pinned SpotiFLAC provider stack once

on:
  push:
    branches:
      - feature/openspot-vnext-extension-automix
    paths:
      - '.github/workflows/import-spotiflac-provider-stack-once.yml'

permissions:
  contents: write

jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/openspot-vnext-extension-automix
      - name: Import exact pinned provider stack
        env:
          PIN: 8165fc99f18234049d003ec8379dea7792c452a1
        run: |
          set -euo pipefail
          base="https://raw.githubusercontent.com/todo996/SpotiFLAC-Mobile/${PIN}/go_backend"
          dest="third_party/spotiflac-extension-core/upstream"
          for file in \
            extension_provider_wrapper.go \
            extension_providers.go \
            extension_fallback.go \
            extension_fallback_helpers.go \
            cross_extension_share.go \
            title_match_utils.go; do
            curl --fail --location --silent --show-error "$base/$file" --output "$dest/$file"
            test -s "$dest/$file"
          done
      - name: Commit pinned provider stack
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add third_party/spotiflac-extension-core/upstream/
          if git diff --cached --quiet; then
            echo 'Pinned provider stack already matches.'
            exit 0
          fi
          git commit -m 'vendor(extension): import pinned provider stack'
          git push origin HEAD:feature/openspot-vnext-extension-automix
